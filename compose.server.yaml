services:
  app:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    env_file: .env.server
    environment:
      RECIPE_INTELLIGENCE_MODE: server
      RECIPE_INTELLIGENCE_ROOT: /var/lib/recipe-intelligence
      PORT: 3000
    volumes:
      - recipe-data:/var/lib/recipe-intelligence
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/server-health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      SERVER_DOMAIN: ${SERVER_DOMAIN:?Set SERVER_DOMAIN in .env.server}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  recipe-data:
  caddy-data:
  caddy-config:
