name: Verified offline backup cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recipe-intelligence-instabox
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == 'salahkessab/track-compititor' && github.event.repository.private == true
    runs-on: [self-hosted, Linux, X64, recipe-intelligence-instabox]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Keep the current app image after verified PC backup
        run: flock -n /data/recipe-intelligence-trial/deployment.lock node maintenance/prune-verified-images.cjs
